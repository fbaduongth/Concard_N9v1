<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 39 953 953" width="512" height="512">
  <!-- Truck Silhouette & Cargo Crates (100% Vector, Transparent Background) -->
  <g fill="#000000">
    <!-- 3 Cargo Crates -->
    <rect x="461" y="371" width="86" height="76" />
    <rect x="582" y="371" width="86" height="76" />
    <rect x="702" y="371" width="86" height="76" />

    <!-- Chassis, Cab Backrest & Wheel-Arch Cutouts -->
    <path d="M 235 456 H 394 V 416 H 431 V 456 H 788 V 584 H 770.975 A 79 79 0 0 0 613.025 584 H 427.975 A 79 79 0 0 0 270.025 584 H 235 Z" />

    <!-- Steering Column & Steering Wheel -->
    <line x1="292" y1="460" x2="327" y2="394" stroke="#000000" stroke-width="13" stroke-linecap="butt" />
    <line x1="301" y1="383.5" x2="354.5" y2="405.5" stroke="#000000" stroke-width="13.5" stroke-linecap="round" />

    <!-- Front & Rear Wheels (Transparent Hubs) -->
    <circle cx="349" cy="586" r="57.25" fill="none" stroke="#000000" stroke-width="17.5" />
    <circle cx="692" cy="586" r="57.25" fill="none" stroke="#000000" stroke-width="17.5" />
  </g>

  <!-- Red Prohibition Ring & Diagonal Slash -->
  <g fill="none" stroke="#CC332B">
    <circle cx="511.5" cy="515.5" r="419.5" stroke-width="94" />
    <line x1="215" y1="219" x2="808" y2="812" stroke-width="57.5" stroke-linecap="butt" />
  </g>
</svg>
