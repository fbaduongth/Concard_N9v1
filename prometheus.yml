# 1. Cấu hình chu kỳ thu thập chung
global:
  scrape_interval: 10s       # Cứ 10 giây Prometheus sẽ quét lấy dữ liệu AP một lần
  evaluation_interval: 10s   # Chu kỳ kiểm tra các điều kiện cảnh báo (rules)

# 2. Danh sách các mục tiêu cần thu thập dữ liệu (Scrape Targets)
scrape_configs:

  # Mục tiêu 1: Giám sát chính hệ thống Prometheus (mặc định)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Mục tiêu 2: GIÁM SÁT HỆ THỐNG ACCESS POINT TOTOLINK N9v1 (Thêm mới đoạn này)
  - job_name: 'totolink_ap_collector'
    metrics_path: '/metrics'   # Đường dẫn endpoint cấp dữ liệu
    scrape_interval: 10s       # Tần suất lấy dữ liệu từ AP
    scrape_timeout: 5s         # Thời gian tối đa chờ phản hồi (nếu quá 5s coi như lỗi)
    static_configs:
      - targets:
          - 'localhost:9100'   # Địa chỉ và cổng Collector đang chạy
        labels:
          environment: 'production'
          device_type: 'access_point'
          managed_by: 'standalone_collector'